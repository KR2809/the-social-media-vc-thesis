[project]
name = "the-social-media-vc-thesis"
version = "0.1.0"
description = "Pre-seed VC allocation framework from public social-media signals (BBA thesis)"
authors = [{ name = "Kristian Ratkov", email = "kristian.ratkov@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "snscrape",
    "praw>=7.7",
    "anthropic>=0.40",
    "openai>=1.40",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "streamlit>=1.40",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "click>=8.1",
    "tenacity>=8.5",
    "tqdm>=4.66",
    "pytrends>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "black>=24.8",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "scoring", "analysis", "models"]
